################
### MONITORS ###
################
source = ~/.config/hypr/monitor.conf

###################
### MY PROGRAMS ###
###################
# Set programs that you use
$terminal = kitty
$fileManager = thunar
#$menu = ~/.config/rofi/launcher
$menu = rofi -show drun -theme ~/.config/rofi/style.rasi -run-command "uwsm app -- {cmd}"
$power = ~/.config/rofi/rofi-power
$scr = ~/.config/hypr/scripts/screenshot.sh
$bookmark = ~/.config/rofi/bookmark

#################
### AUTOSTART ###
#################
#exec-once = systemctl --user import-environment
#exec-once = systemctl --user start hyprpolkitagent
exec-once = uwsm app -- /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec-once = uwsm app -- nm-applet
exec-once = uwsm app -- udiskie -t
exec-once = uwsm app -- hyprpaper
exec-once = hyprctl dispatch workspace 1
exec-once = uwsm app -- waybar

### ENVIRONMENT VARIABLES ###
#############################

#env = XDG_CURRENT_DESKTOP,Hyprland
#env = XDG_SESSION_TYPE,wayland
#env = XDG_SESSION_DESKTOP,Hyprland
#env = GTK_IM_MODULE,wayland
#env = QT_AUTO_SCREEN_SCALE_FACTOR,1
#env = QT_QPA_PLATFORM,wayland;xcb
#env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
#env = QT_QPA_PLATFORMTHEME,qt5ct
#env = XCURSOR_THEME,rose-pine-hypr
#env = XCURSOR_SIZE,24
#env = HYPRCURSOR_THEME,rose-pine-hyprcursor
#env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(bd93f9) #rgba(6272a4ee) 45deg
    col.inactive_border = rgba(20182aaa)
    hover_icon_on_border = true
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 3
    active_opacity = 1.0
    inactive_opacity = 1.0

    #shadow {
    #    enabled = true
    #    range = 30
    #    render_power = 10
    #    color = rgba(1a1a1aee)
    #}

    #blur {
    #    enabled = true
    #    size = 3
    #    passes = 1
    #    vibrancy = 0.1696
    #}

   #dim_special = 0.5
}

animations {
    enabled = true

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
   animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade

}

# "Smart gaps" / "No gaps when only"
 workspace = w[tv1], gapsout:0, gapsin:0
 workspace = f[1], gapsout:0, gapsin:0
 windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
 windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
 windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
 windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

dwindle {
    pseudotile = true
    preserve_split = true
    special_scale_factor = 0.8
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 
    disable_hyprland_logo = true 
    new_window_takes_over_fullscreen = 1
    background_color = 0x000000
    font_family = "JetBrainsMono Nerd Font"
    disable_autoreload = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    numlock_by_default = true
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
        tap-to-click = true
    }
}

gestures {
    workspace_swipe = true
  	workspace_swipe_invert = false
  	workspace_swipe_fingers = 3
  	workspace_swipe_forever = true
  	workspace_swipe_create_new = true
  	workspace_swipe_distance = 700
}

# Example per-device config
#device {
#    name = epic-mouse-v1
#    sensitivity = -0.5
#}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER 

bind = $mainMod, Return, exec, uwsm app -- $terminal
bind = $mainMod, KP_Enter, exec, uwsm app -- $terminal
bind = $mainMod SHIFT, Return, exec, uwsm app -- kitty -T 'kitty-float'
bind = $mainMod SHIFT, KP_Enter, exec, uwsm app -- kitty -T 'kitty-float'
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, uwsm app -- $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, B, exec, $bookmark
bind = $mainMod, C, exec, uwsm app -- galculator
bind = $mainMod, P, pseudo, 
bind = $mainMod, J, togglesplit, 
bind = $mainMod, F, fullscreenstate, 1
bind = $mainMod, X, exec,$power 
bind = $mainMod SHIFT, B, exec, killall waybar && uwsm app -- waybar
bind = $mainMod SHIFT, F, fullscreenstate, 2
bind = $mainMod SHIFT, P, exec, uwsm app -- pavucontrol
bind = $mainMod SHIFT, V, exec, uwsm app -- VBoxManage startvm 'XP'
bind = $mainMod SHIFT, Z, exec, hyprctl reload
bind = $mainMod SHIFT, X, exec, hyprctl --batch "keyword general:gaps_out 0;keyword general:gaps_in 0;keyword decoration:rounding 0"
bind = $mainMod SHIFT, C, exec, hyprctl --batch "keyword animations:enabled 0;keyword decoration:drop_shadow 0;keyword blur:enable 0"
bind = $mainMod SHIFT, C, exec, notify-send "Fancy stuff disabled"
bind = $mainMod, TAB, focusmonitor, +1
bind = $mainMod SHIFT, TAB, focusmonitor, -1
bind = ALT, TAB, cyclenext
bind = ALT, TAB, bringactivetotop
bind = CTRL, Space, exec, dunstctl close
bind = CTRL_ALT, M, exec, ~/.config/hypr/scripts/volume --toggle
bind = CTRL_ALT, L, exec, uwsm app -- hyprlock
bind = CTRL_ALT_SHIFT, P, exec, source ~/Documents/Source/pyenv/bin/activate && uwsm app -- python ~/Documents/Source/yt-dlp-gui/app/app.py

bind = $mainMod, F1, exec, uwsm app -- firefox
bind = $mainMod SHIFT, F1, exec,uwsm app -- firefox --private-window
bind = $mainMod SHIFT, F2, exec, uwsm app -- kitty -T 'superfile' -e spf
bind = $mainMod, F2, exec, uwsm app -- kitty -T 'yazi file manager' -e yazi
bind = $mainMod, F3, exec, uwsm app -- thunar
bind = $mainMod, F4, exec, uwsm app -- ~/Documents/Source/Gimp/squashfs-root/AppRun
bind = $mainMod, F6, exec, uwsm app -- ~/Documents/Source/Inkscape/squashfs-root/AppRun
#bind = $mainMod, F7, exec, uwsm app -- ~/Documents/Source/KDenlive/AppRun
bind = $mainMod, F9, exec, ~/.config/hypr/scripts/volume --toggle
bind = $mainMod, F10, exec, ~/.config/hypr/scripts/volume --dec
bind = $mainMod, F11, exec, ~/.config/hypr/scripts/volume --inc
#bind = $mainMod, F12, exec, uwsm app -- kitty -e tray-tui

bind = , Print, exec, $scr
bind = CTRL_ALT, P, exec, $scr

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, KP_End, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, KP_Down, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, KP_Next, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, KP_Left, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, KP_Begin, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, KP_Right, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, KP_Home, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, KP_Up, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, KP_Prior, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, KP_Insert, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod SHIFT, left, workspace, -1
bind = $mainMod SHIFT, right, workspace, +1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

$moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
binded = $mainMod SHIFT $CONTROL, left,Move activewindow to the right,exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
binded = $mainMod SHIFT $CONTROL, right,Move activewindow to the right,exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
binded = $mainMod SHIFT $CONTROL, up,Move activewindow to the right,exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u
binded = $mainMod SHIFT $CONTROL, down,Move activewindow to the right,exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d

##############################
### 		RULES 	   	   ###
##############################


#windowrule = float, title:^(kitty-float)$
windowrulev2 = float, initialTitle:^(kitty-float)$
windowrulev2 = center, initialTitle:^(kitty-float)$
windowrulev2 = size 600 300, initialTitle:^(kitty-float)

windowrulev2 = float, initialTitle:^(nmtui)$
windowrulev2 = center, initialTitle:^(nmtui)$
windowrulev2 = size 600 400, initialTitle:^(nmtui)$

windowrulev2 = float, initialTitle:^(Volume Control)$
windowrulev2 = size 50% 50%, initialTitle:^(Volume Control)$

windowrulev2 = float, initialTitle:^(Qalculate!)$
windowrulev2 = size 50% 50%, initialTitle:^(Qalculate!)$

windowrulev2 = float, initialTitle:^(galculator)$
windowrulev2 = size 326 534, initialTitle:^(galculator)$

windowrulev2 = float, initialClass:^(imv)$
windowrulev2 = size 70% 70%, initialClass:^(imv)$

windowrulev2 = suppressevent maximize, class:.*

$vboxwins = class:(VirtualBox)|(VirtualBox Manager)|(virt-manager)
windowrulev2 = float,$vboxwins
windowrulev2 = size 800 600,$vboxwins
windowrulev2 = center,$vboxwins

# File dialogs
$center-float-title = title:^(.*Open Folder.*)$|^(.*Open File.*)$|^(.*Save File.*)$|^(.*Save Folder.*)$|^(.*Save Image.*)$|^(.*Save As.*)$|^(.*Open As.*)$|^(.*Select file.*)$|^(.*Select folder.*)$|^(.*Open Archive.*)$|^(.*File Operation Progress.*)$|^(.*Load PDF Image.*)$|^(.*Export Image as PDF.*)$
windowrulev2 = float, $center-float-title
windowrulev2 = center 1, $center-float-title
windowrulev2 = size 50% 50%, $center-float-title

windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = size 689 400, class:^(org.pulseaudio.pavucontrol)$


windowrulev2 = float, class:^(densify)$
windowrulev2 = size 296 762, class:^(densify)$

windowrulev2 = float, class:^(nwg-look)$

#layerrule = animation slide, rofi
layerrule = animation slide, notifications

# Fix some dragging issues with XWayland
# windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
